<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Federado de Datos Sanitarios - NNA</title>

  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js para convertir Markdown a HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- html2pdf.js para exportar la vista a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Feather Icons para iconografía -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    /* Estilos específicos para la renderización de Markdown */
    .markdown-body h1 { font-size: 1.875rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 1rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
    .markdown-body h2 { font-size: 1.5rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.75rem; color: #334155; }
    .markdown-body h3 { font-size: 1.25rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #475569; }
    .markdown-body h4 { font-size: 1.1rem; font-weight: 600; margin-top: 0.85rem; margin-bottom: 0.4rem; color: #475569; }
    .markdown-body p { margin-bottom: 1rem; line-height: 1.7; color: #334155; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
    .markdown-body li { margin-bottom: 0.25rem; }
    .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #64748b; italic: true; margin-bottom: 1rem; background-color: #eff6ff; padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1.5rem; }
    .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: 0.6rem 0.8rem; text-align: left; font-size: 0.9rem; }
    .markdown-body th { background-color: #f1f5f9; font-weight: 600; color: #1e293b; }
    .markdown-body tr:nth-child(even) { background-color: #f8fafc; }
    .markdown-body a { color: #2563eb; text-decoration: underline; }
    .markdown-body hr { margin: 2rem 0; border-color: #e2e8f0; }

    /* Ajustes específicos para exportación a PDF */
    .pdf-export-header {
      display: none;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      padding: 10px 0;
      border-bottom: 2px solid #000;
      margin-bottom: 20px;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased flex flex-col h-screen overflow-hidden">

  <!-- Header Superior -->
  <header class="bg-slate-900 text-white flex items-center justify-between px-6 py-4 shadow-md z-20">
    <div class="flex items-center gap-4">
      <button id="toggleSidebarBtn" class="text-slate-300 hover:text-white focus:outline-none">
        <i data-feather="menu"></i>
      </button>
      <h1 class="text-lg font-semibold tracking-wide">Visor de Trabajos y Documentación</h1>
    </div>
    <div>
      <button id="downloadPdfBtn" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg shadow transition duration-200">
        <i data-feather="download"></i>
        <span>Descargar PDF</span>
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden relative">

    <!-- Menú Lateral (Sidebar) -->
    <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between transition-all duration-300 z-10">
      <div class="p-4 overflow-y-auto">
        
        <div class="mb-6">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Documento Principal</h2>
          <button id="mainWorkBtn" class="w-full flex items-center gap-2 px-3 py-2 text-sm font-medium text-blue-700 bg-blue-50 rounded-md hover:bg-blue-100 transition">
            <i data-feather="file-text" class="w-4 h-4"></i>
            <span>Trabajo Principal</span>
          </button>
        </div>

        <div>
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Anexos</h2>
          <ul id="annexList" class="space-y-1">
            <!-- Los links a anexos se cargan dinámicamente aquí -->
          </ul>
        </div>

      </div>

      <div class="p-4 border-t border-slate-100 text-xs text-slate-400 text-center">
        Gestión de Políticas Públicas
      </div>
    </aside>

    <!-- Área de Contenido Principal -->
    <main class="flex-1 overflow-y-auto p-6 md:p-10 bg-slate-50 flex justify-center">
      <div class="w-full max-w-4xl bg-white p-8 md:p-12 rounded-xl shadow-sm border border-slate-200 my-auto min-h-full flex flex-col">
        
        <!-- Encabezado para impresión/PDF (se activa solo al exportar) -->
        <div id="pdfHeader" class="pdf-export-header"></div>

        <!-- Contenedor dinámico de contenido -->
        <div id="contentViewer" class="markdown-body flex-1">
          <div class="flex items-center justify-center h-64 text-slate-400">
            <p>Cargando documento...</p>
          </div>
        </div>

      </div>
    </main>

  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN Y ARCHIVOS
    // ==========================================
    const MAIN_WORK_FILE = 'trabajo-principal.md';

    // Registra aquí los anexos adicionales (Markdown o Imágenes)
    const ANNEXES = [
      { id: 1, title: 'Anexo 1: Marco Legal Complementario', file: 'anexos/anexo1.md', type: 'md' },
      { id: 2, title: 'Anexo 2: Diagrama de Arquitectura Federada', file: 'anexos/anexo2.jpg', type: 'image' },
      { id: 3, title: 'Anexo 3: Diagrama de Secuencia AMFE', file: 'anexos/anexo3.png', type: 'image' }
    ];

    // Estructura de estado
    let currentView = {
      type: 'main', // 'main' o 'annex'
      title: 'TRABAJO PRINCIPAL',
      headerTitle: '',
      file: MAIN_WORK_FILE,
      contentType: 'md'
    };

    // DOM Elements
    const contentViewer = document.getElementById('contentViewer');
    const pdfHeader = document.getElementById('pdfHeader');
    const annexList = document.getElementById('annexList');
    const mainWorkBtn = document.getElementById('mainWorkBtn');
    const downloadPdfBtn = document.getElementById('downloadPdfBtn');
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

    // Inicializar Iconos
    feather.replace();

    // ==========================================
    // FUNCIONALIDADES PRINCIPALES
    // ==========================================

    // Inicialización de la app
    function init() {
      renderAnnexMenu();
      loadMainWork();
    }

    // Renderizar menú lateral de anexos
    function renderAnnexMenu() {
      annexList.innerHTML = '';
      ANNEXES.forEach(annex => {
        const li = document.createElement('li');
        const icon = annex.type === 'md' ? 'file-text' : 'image';
        li.innerHTML = `
          <button data-id="${annex.id}" class="annex-btn w-full flex items-center gap-2 px-3 py-2 text-sm text-slate-600 rounded-md hover:bg-slate-100 hover:text-slate-900 transition">
            <i data-feather="${icon}" class="w-4 h-4 text-slate-400"></i>
            <span class="truncate">${annex.title}</span>
          </button>
        `;
        annexList.appendChild(li);
      });
      feather.replace();

      // Event Listeners para Anexos
      document.querySelectorAll('.annex-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(e.currentTarget.getAttribute('data-id'));
          const annex = ANNEXES.find(a => a.id === id);
          if (annex) loadAnnex(annex);
        });
      });
    }

    // Cargar Trabajo Principal
    function loadMainWork() {
      currentView = {
        type: 'main',
        title: 'TRABAJO PRINCIPAL',
        headerTitle: '',
        file: MAIN_WORK_FILE,
        contentType: 'md'
      };
      updateActiveMenuState(mainWorkBtn);
      fetchAndRenderContent(MAIN_WORK_FILE, 'md');
    }

    // Cargar Anexo
    function loadAnnex(annex) {
      currentView = {
        type: 'annex',
        title: `ANEXO ${annex.id}`,
        headerTitle: `ANEXO ${annex.id}: ${annex.title.replace(/^Anexo \d+:\s*/, '')}`,
        file: annex.file,
        contentType: annex.type
      };
      const btn = document.querySelector(`.annex-btn[data-id="${annex.id}"]`);
      updateActiveMenuState(btn);
      fetchAndRenderContent(annex.file, annex.type);
    }

    // Resaltar ítem activo en el menú
    function updateActiveMenuState(activeBtn) {
      document.querySelectorAll('#sidebar button').forEach(b => {
        b.classList.remove('bg-blue-50', 'text-blue-700', 'font-medium', 'bg-slate-100', 'text-slate-900');
        b.classList.add('text-slate-600');
      });
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-600');
        activeBtn.classList.add('bg-blue-50', 'text-blue-700', 'font-medium');
      }
    }

    // Obtener y Renderizar el Contenido
    async function fetchAndRenderContent(filePath, type) {
      contentViewer.innerHTML = `<div class="flex items-center justify-center h-64 text-slate-400"><p>Cargando contenido...</p></div>`;

      try {
        if (type === 'md') {
          const response = await fetch(filePath);
          if (!response.ok) throw new Error(`No se pudo cargar el archivo (${response.status})`);
          const markdownText = await response.text();
          contentViewer.innerHTML = marked.parse(markdownText);
        } else if (type === 'image') {
          contentViewer.innerHTML = `
            <div class="flex flex-col items-center justify-center py-4">
              <h2 class="text-xl font-bold mb-4 text-slate-800">${currentView.headerTitle || currentView.title}</h2>
              <img src="${filePath}" alt="${currentView.title}" class="max-w-full h-auto rounded-lg shadow-md border border-slate-200 mb-4" />
            </div>
          `;
        }
      } catch (error) {
        contentViewer.innerHTML = `
          <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg">
            <h3 class="font-bold mb-1">Error de carga</h3>
            <p class="text-sm">No se pudo obtener el archivo <code>${filePath}</code>. Asegúrate de haberlo subido al repositorio en la ruta correcta.</p>
          </div>
        `;
      }
    }

    // ==========================================
    // DESCARGA PDF CON CABECERA PERSONALIZADA
    // ==========================================
    downloadPdfBtn.addEventListener('click', () => {
      // Configurar encabezado visible solo en el PDF
      if (currentView.type === 'annex') {
        pdfHeader.style.display = 'block';
        pdfHeader.innerText = currentView.headerTitle.toUpperCase();
      } else {
        pdfHeader.style.display = 'none';
      }

      const element = document.querySelector('main > div');
      const filename = currentView.type === 'annex' 
        ? `${currentView.title.replace(/\s+/g, '_')}.pdf` 
        : 'Trabajo_Principal.pdf';

      const opt = {
        margin:       [12, 12, 12, 12],
        filename:     filename,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
      };

      // Generar PDF
      html2pdf().set(opt).from(element).save().then(() => {
        // Restaurar estado visual tras descarga
        pdfHeader.style.display = 'none';
      });
    });

    // Toggle para menú lateral responsive
    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-ml-64');
    });

    // Asignar evento al botón principal
    mainWorkBtn.addEventListener('click', loadMainWork);

    // Inicializar al cargar
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
